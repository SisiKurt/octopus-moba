<title>🐙 Octopus MOBA</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; background:#0a0a14; color:#eee; font-family:system-ui,sans-serif; overflow:hidden; }
  #screen { position:relative; width:100vw; height:100vh; background:#0a0a14; overflow:hidden; }
  #cv { position:absolute; left:0; top:0; width:100vw; height:100vh; background:#1a1a2a; image-rendering:pixelated; touch-action:none; }

  #hud { position:absolute; top:0; left:0; right:0; padding:8px 10px; display:none;
    text-align:left;
    background:linear-gradient(180deg, rgba(0,0,0,.6), transparent); pointer-events:none; z-index:5; }
  #hud .row { display:flex; gap:10px; align-items:center; font-size:14px; }
  #hud .bar { flex:1; height:10px; background:#333; border-radius:5px; overflow:hidden; }
  #hud .bar > div { height:100%; background:#dd3344; transition:width .1s; }
  #hud .gold { color:#ffd54a; }
  #hud .lvl { color:#7ad7ff; }

  /* выбор героя */
  #hero-pick { position:absolute; inset:0; background:rgba(0,0,0,.85);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:20; }
  #hero-pick h2 { font-size:18px; }
  #hero-pick h3 { font-size:11px; color:#888; }
  #hero-pick .list { display:flex; gap:10px; }
  #hero-pick button { padding:12px 16px; background:#222a44; color:#eee;
    border:2px solid #334; border-radius:8px; font-size:13px; }
  #hero-pick button.green { border-color:#22dd66; }
  #hero-pick button.blue  { border-color:#4488ff; }
  #hero-pick button.purple{ border-color:#cc44ff; }

  /* джойстик — позиционируется из JS относительно канваса */
  #joystick { position:absolute; width:120px; height:120px;
    background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.2);
    border-radius:50%; z-index:10; touch-action:none; display:none; }
  #joystick .knob { position:absolute; left:50%; top:50%; width:50px; height:50px;
    background:rgba(255,255,255,.4); border-radius:50%; transform:translate(-50%,-50%); }

  /* скиллы — позиционируется из JS относительно канваса */
  #skills { position:absolute;
    display:flex; flex-direction:column; gap:8px; z-index:10; display:none; }
  #skills button { width:44px; height:44px; background:#1d2742; color:#eee; border:1px solid #334; border-radius:6px; font-size:10px; position:relative; }
  #skills button .lvl { position:absolute; bottom:2px; right:4px; color:#ffd54a; }

  /* инвентарь — позиционируется из JS относительно канваса */
  #inventory { position:absolute;
    display:flex; flex-direction:column; gap:6px; z-index:10; display:none; }
  #inventory .slot { width:44px; height:52px; background:#0e1424; color:#556;
    border:1px dashed #334; border-radius:6px; font-size:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden; padding:2px; }
  #inventory .slot.filled { background:#1d2742; color:#eee; border-style:solid; border-color:#7ad7ff; }
  #inventory .slot .weap-ico { font-size:18px; line-height:1; }
  #inventory .slot .weap-name { font-size:7px; opacity:0.7; margin-top:1px; text-align:center; }
  #inventory .slot .cnt { position:absolute; top:1px; right:3px; font-size:11px;
    font-weight:bold; font-family:monospace; }
  #inventory .slot .empty { font-size:18px; color:#334; }

  /* магазин — горизонтальный ряд квадратиков внизу канваса
     квадратики по нижнему краю, ряд в 1 строку, джойстик НАД ними */
  #shop { position:absolute; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:row; flex-wrap:nowrap; gap:4px; align-items:flex-end;
    justify-content:center; z-index:10; display:none; max-width:100%;
    padding-bottom:4px; white-space:nowrap; overflow-x:auto; }
  #shop button {
    width:48px; height:48px; padding:0;
    background:#1d2742; color:#eee; border:2px solid #556; border-radius:8px;
    font-size:9px; line-height:1.1; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; position:relative; cursor:pointer; user-select:none;
  }
  #shop button .ico { font-size:18px; line-height:1; margin-bottom:1px; }
  #shop button .label { font-size:8px; opacity:0.85; }
  #shop button .price { position:absolute; top:1px; right:3px; font-size:8px;
    color:#ffd54a; font-weight:bold; }
  #shop button.owned { opacity:.5; background:#103a1f; border-color:#22dd66; }
  /* стартовое оружие — кнопка рабочая (для докупа 2-й копии), подсветка ★ */
  #shop button.starter { opacity:1; background:#1f3a52; border-color:#a8e6ff; cursor:pointer; box-shadow:inset 0 0 8px rgba(122,215,255,.4); }
  #shop button.starter:hover { background:#2a5278; }
  #shop button:disabled { opacity:.4; }
  #shop .merge-hint { flex-basis:100%; font-size:10px; color:#888; margin-top:2px; text-align:center; }

  /* индикатор "магазин доступен" — позиционируется из JS относительно канваса */
  #shop-indicator { position:absolute; left:50%; transform:translateX(-50%);
    background:#22dd66; color:#000; padding:4px 10px; border-radius:12px; font-size:11px; display:none; z-index:10; }

  /* мерж-подсказка в инвентаре — отключена */
</style>

<body>
<div id="screen">
  <canvas id="cv" width="500" height="800"></canvas>

  <div id="hud">
    <div class="row">
      <span class="lvl" id="lvl">Lv 1</span>
      <div class="bar"><div id="hp" style="width:100%"></div></div>
      <span class="gold" id="gold">0$</span>
    </div>
    <div id="timer" style="margin-top:6px;display:inline-block;color:#7ad7ff;padding:5px 12px;background:rgba(0,0,0,.7);border-radius:14px;font-family:monospace;font-size:13px;font-weight:bold;letter-spacing:1px;">⏱ 00:00</div>
  </div>

  <div id="heal-indicator" style="position:absolute;top:34px;left:50%;transform:translateX(-50%);background:rgba(34,222,102,.85);color:#000;padding:2px 8px;border-radius:10px;font-size:10px;display:none;z-index:20;font-weight:bold;">+ HP</div>

  <div id="hero-pick">
    <h2>🐙 Octopus MOBA</h2>
    <h3>Выбери своего осьминога</h3>
    <div id="version-tag" style="font-size:10px;color:#7ad7ff;font-family:monospace;margin:6px 0 14px;padding:3px 8px;background:rgba(122,215,255,.1);border-radius:4px;border:1px solid rgba(122,215,255,.3);">v0.7.6</div>
    <div class="list">
      <button class="green" data-h="agile">Ловкач<br><small>быстрый</small></button>
      <button class="blue"  data-h="tank">Танк<br><small>бронированный</small></button>
      <button class="purple" data-h="miner">Минёр<br><small>с взрывчаткой</small></button>
    </div>
  </div>

  <div id="joystick"><div class="knob"></div></div>
  <div id="skills"></div>
  <div id="inventory"></div>
  <div id="shop"></div>
  <div id="shop-indicator">Магазин рядом ⬇</div>
  <div id="waking" style="display:none;position:absolute;inset:0;background:rgba(10,10,20,.85);z-index:50;align-items:center;justify-content:center;flex-direction:column;color:#eee;font-family:system-ui;text-align:center;padding:20px;pointer-events:none;transition:opacity .4s;opacity:1;">
    <div style="font-size:48px;">🐙💤</div>
    <h2 style="margin:14px 0;">Render просыпается…</h2>
    <p style="opacity:.7;font-size:14px;max-width:280px;">Free инстанс засыпает через 15 мин простоя.<br>Первый запуск после сна ≈ 30-90 сек.<br>Подожди и НЕ перезагружай страницу.</p>
    <div id="waking-spinner" style="margin-top:20px;width:36px;height:36px;border:3px solid #333;border-top-color:#7ad7ff;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <p id="waking-retry" style="margin-top:18px;font-size:12px;opacity:.5;font-family:monospace;"></p>
  </div>
  <div id="conn-status" style="position:absolute;bottom:6px;right:6px;font-size:10px;padding:3px 6px;background:rgba(0,0,0,.7);border-radius:6px;color:#888;z-index:30;font-family:monospace;">⏳ …</div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<script>
const waking = document.getElementById('waking');
const wakingRetry = document.getElementById('waking-retry');

// Показать waking сразу
waking.style.display = 'flex';
window.appReady = false;
function hideWaking() {
  if (window.appReady) return;
  window.appReady = true;
  waking.style.opacity = '0';
  setTimeout(() => { waking.style.display = 'none'; }, 400);
  // safety: pokeInterval/wakeTimer объявлены ниже в другом <script>; try/catch
  try { if (typeof pokeInterval !== 'undefined' && pokeInterval) { clearInterval(pokeInterval); pokeInterval = null; } } catch(e) {}
  try { if (typeof wakeTimer !== 'undefined' && wakeTimer) { clearTimeout(wakeTimer); wakeTimer = null; } } catch(e) {}
}
window.hideWaking = hideWaking;
window.addEventListener('appready', hideWaking);

// safety net: спрятать overlay через 8 сек в любом случае (даже если state не пришёл)
setTimeout(hideWaking, 8000);
</script>
<script src="/socket.io/socket.io.js"></script>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
// socket.io с длинными таймаутами — Render cold start 30-90сек
const socket = io({
  transports: ['polling', 'websocket'],
  upgrade: true,
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000,
  reconnectionDelayMax: 8000,
  timeout: 120000,           // 2 мин на connect
  pingInterval: 25000,
  pingTimeout: 60000
});
let me = null;
let heroes = {};
let weapons = {};
let lastState = null;

const hud = document.getElementById('hud');
const hpEl = document.getElementById('hp');
const goldEl = document.getElementById('gold');
const lvlEl = document.getElementById('lvl');
const heroPick = document.getElementById('hero-pick');
const joystick = document.getElementById('joystick');
const skillsDiv = document.getElementById('skills');
const inventoryDiv = document.getElementById('inventory');
const shop = document.getElementById('shop');
const shopIndicator = document.getElementById('shop-indicator');

let inputKeys = { up:false, down:false, left:false, right:false };
let aimX = 0, aimY = 0;
let joyActive = null, joyCenter = null;
let shopOpen = false;

// ---------- resize canvas ПОД ЭКРАН (вся карта на весь экран, без полей) ----------
// Логическая плоскость игры 480×854 — игра по-прежнему работает в этих координатах.
// CSS-масштаб растягивает канвас на весь экран, чтобы убрать чёрные полосы.
const LOGICAL_W = 480;
const LOGICAL_H = Math.round(LOGICAL_W * 16 / 9);  // 854 — мобильный портрет 9:16
const ASPECT = LOGICAL_W / LOGICAL_H; // ~0.5625
function resize() {
  cv.width = LOGICAL_W;
  cv.height = LOGICAL_H;
  // Берём весь экран — карта на 100vw × 100vh, без safe area.
  // Логические координаты растягиваются пропорционально.
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  // FILL: канвас = 100vw × 100vh, чтобы убрать чёрные полосы по бокам.
  // На очень узких/широких экранах пропорции чуть исказятся — это ОК для топ-даун.
  cv.style.width = vw + 'px';
  cv.style.height = vh + 'px';
  cv.style.position = 'absolute';
  cv.style.left = '0px';
  cv.style.top = '0px';
}
// ---------- позиционирование UI-оверлеев поверх канваса ----------
// (shop, shop-indicator, joystick, skills, inventory располагаются
//  относительно канваса, чтобы не перекрывать нижнюю часть карты)
function positionOverlays() {
  const r = cv.getBoundingClientRect();   // реальные экранные координаты канваса

  // ---- shop: квадратики по нижнему краю канваса, ВСЕГДА В 1 СТРОКУ ----
  // 6 кнопок 48×48 + 5 gap 4 = 308px, помещается в 360px viewport.
  // Сдвигаем на 4px ниже, чтобы хорошо отделялся от джойстика и края канваса.
  const SHOP_BTN = 48;
  const SHOP_GAP = 4;
  const SHOP_BOTTOM_OFFSET = 12;    // пикселей от низа канваса (отодвигаем ещё ниже)
  const shopH = SHOP_BTN + SHOP_BOTTOM_OFFSET + 18;  // +18 под merge-hint
  // ширина shop: при wide-bottoms (>=6 стволов в ряд) разрешаем нависать на ±30px по бокам от канваса
  const shopMaxW = r.width + 60;
  shop.style.maxWidth = shopMaxW + 'px';
  shop.style.left = (r.left + r.width / 2) + 'px';
  shop.style.bottom = '';
  shop.style.top = (r.bottom - shopH) + 'px';
  shop.style.transform = 'translateX(-50%)';

  // ---- shop-indicator: маленькая плашка чуть выше shop ----
  shopIndicator.style.left = (r.left + r.width / 2) + 'px';
  shopIndicator.style.bottom = '';
  const indTop = Math.max(r.top + 6, r.bottom - shopH - 24);
  shopIndicator.style.top = indTop + 'px';
  shopIndicator.style.transform = 'translateX(-50%)';

  // ---- joystick: слева внизу, НАД shop (а не под ним) ----
  // joystick 120×120, ставим НАД магазином, чтобы палец не тянулся через квадратики
  // minTop = cv.top+10 (чтобы не уехать выше канваса)
  joystick.style.left = (r.left + 18) + 'px';
  joystick.style.bottom = '';
  const joyTop = Math.max(r.top + 10, r.bottom - shopH - 132);
  joystick.style.top = joyTop + 'px';   // 120px + 12px зазор

  // ---- skills: слева, по центру канваса ----
  const skillsH = skillsDiv.offsetHeight || 304;
  skillsDiv.style.left = (r.left + 10) + 'px';
  skillsDiv.style.top = (r.top + r.height / 2 - skillsH / 2) + 'px';
  skillsDiv.style.transform = '';

  // ---- inventory: справа, по центру канваса ----
  // 6 слотов × 52 + 5 gap × 6 = 342px; используем реальную если есть
  const invH = inventoryDiv.offsetHeight || 342;
  inventoryDiv.style.left = (r.right - 54) + 'px';
  inventoryDiv.style.top = (r.top + r.height / 2 - invH / 2) + 'px';
  inventoryDiv.style.transform = '';
}
window.addEventListener('resize', () => { resize(); positionOverlays(); });
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); positionOverlays(); }, 100));
resize();
positionOverlays();

// ---------- выбор героя ----------
document.querySelectorAll('#hero-pick button').forEach(btn => {
  btn.onclick = () => {
    socket.emit('join', { hero: btn.dataset.h });
    heroPick.style.display = 'none';
    hud.style.display = 'block';
    joystick.style.display = 'block';
    skillsDiv.style.display = 'flex';
    inventoryDiv.style.display = 'flex';
    // после показа UI — пересчитать позиции (offsetHeight теперь валидный)
    setTimeout(positionOverlays, 0);
  };
});

// ---------- джойстик: 8 направлений ----------
// Направление (0-7): 0=N, 1=NE, 2=E, 3=SE, 4=S, 5=SW, 6=W, 7=NW
// -1 = нейтраль (когда джойстик не активен)
let joyDirection = -1;
const knob = joystick.querySelector('.knob');
function joyStart(e) {
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  joyActive = t.identifier ?? 'mouse';
  joyCenter = { x: joystick.offsetLeft + joystick.offsetWidth/2, y: joystick.offsetTop + joystick.offsetHeight/2 };
  joyMove(e); // сразу установить направление если палец уже не в центре
}
function joyMove(e) {
  if (joyActive === null) return;
  e.preventDefault();
  const t = [...(e.touches||[])].find(x => (x.identifier ?? 'mouse') === joyActive) || e;
  const dx = t.clientX - joyCenter.x;
  const dy = t.clientY - joyCenter.y;
  const max = 40;
  const len = Math.hypot(dx, dy);
  // knob визуально
  const cx = len > max ? (dx/len)*max : dx;
  const cy = len > max ? (dy/len)*max : dy;
  knob.style.transform = `translate(calc(-50% + ${cx}px), calc(-50% + ${cy}px))`;
  // если палец слишком близко к центру — считаем нейтралью
  if (len < 10) {
    joyDirection = -1;
    inputKeys.up = inputKeys.down = inputKeys.left = inputKeys.right = false;
    return;
  }
  // угол в радианах: 0 = вправо (восток), -π/2 = верх (север)
  // мы хотим: N=0, NE=1, E=2, SE=3, S=4, SW=5, W=6, NW=7
  // atan2(dy, dx): dy<0=вверх (на экране), dx=0=направо
  const angle = Math.atan2(dy, dx); // в радианах, диапазон [-π, π]
  // смещаем на 22.5° (π/8) чтобы деления 45° попадали в центры секторов
  const shifted = angle + Math.PI / 8;
  // normIdx: 0..7 (8 направлений по 45°)
  let normIdx = Math.floor(shifted / (Math.PI / 4)) % 8;
  if (normIdx < 0) normIdx += 8;
  // atan2(dy,dx): dx=0+dy<0 даёт -π/2 (север). Делим на 8 секторов по π/4 с центрами на 0, π/4, π/2...
  // shifted = angle + π/8 смещает так, чтобы центр первого сектора был на E.
  // Чтобы получить N=0 (сектор [-π/2 ± π/8]) — нужен сдвиг в индексах: normIdx для N = 6 (после +π/8 к -π/2),
  // значит joyDirection = (6 + 2) % 8 = 0 → формула: (normIdx + 2) % 8
  joyDirection = (normIdx + 2) % 8;
  // 4-bit fallback совместимость с inputKeys (для UI, не для движения)
  inputKeys.up    = joyDirection === 0 || joyDirection === 1 || joyDirection === 7;
  inputKeys.down  = joyDirection === 3 || joyDirection === 4 || joyDirection === 5;
  inputKeys.left  = joyDirection === 5 || joyDirection === 6 || joyDirection === 7;
  inputKeys.right = joyDirection === 1 || joyDirection === 2 || joyDirection === 3;
}
function joyEnd(e) {
  joyActive = null;
  joyDirection = -1;
  knob.style.transform = 'translate(-50%, -50%)';
  inputKeys.up = inputKeys.down = inputKeys.left = inputKeys.right = false;
}
joystick.addEventListener('touchstart', joyStart);
joystick.addEventListener('touchmove',  joyMove);
joystick.addEventListener('touchend',   joyEnd);
joystick.addEventListener('mousedown',  joyStart);
window.addEventListener('mousemove', e => { if (joyActive !== null) joyMove(e); });
window.addEventListener('mouseup',   joyEnd);

// ---------- aim: тап по карте ----------
cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; aimFromClient(t.clientX, t.clientY); });
cv.addEventListener('mousedown',  e => aimFromClient(e.clientX, e.clientY));
function aimFromClient(cx, cy) {
  const r = cv.getBoundingClientRect();
  const scaleX = cv.width / r.width;
  const scaleY = cv.height / r.height;
  aimX = (cx - r.left) * scaleX;
  aimY = (cy - r.top)  * scaleY;
}

// ---------- отправка инпута ----------
// direction/aim всегда отправляем (пока палец на джойстике направление должно давить героя каждый тик)
// keys (WASD/стрелки) отправляем только если изменились — для экономии
let lastKeysSent = '';
function emitInput() {
  // keys: throttle
  const keysStr = JSON.stringify(inputKeys);
  const keysChanged = keysStr !== lastKeysSent;
  if (keysChanged) lastKeysSent = keysStr;
  // direction/aim: всегда, пока игрок активен
  socket.emit('input', {
    keys: keysChanged ? inputKeys : null,        // null = без изменений
    direction: joyDirection,
    aim: { x: aimX, y: aimY },
  });
}
setInterval(emitInput, 50);   // 20 Hz — гарантирует постоянное движение

// ---------- сеть ----------
const connStatus = document.getElementById('conn-status');
const setStatus = (msg, ok) => {
  if (!connStatus) return;
  connStatus.textContent = msg;
  connStatus.style.color = ok ? '#22dd66' : '#ff6644';
};
socket.on('connect_error', e => setStatus('❌ ' + (e.message||e), false));
socket.on('disconnect', r => setStatus('⚠️ disconnected: ' + r, false));

// Если Render Free cold start > 8 сек — показать что ждём
let wakeTimer = setTimeout(() => { if (!window.appReady) wakingRetry.textContent = 'Render cold start... ждём socket';}, 8000);

// polling fallback: каждые 3 сек пробуем fetch вручную — разбудить Render
async function pokeServer() {
  try {
    const r = await fetch('/?poke=' + Date.now(), { cache: 'no-store' });
    if (r.ok && !window.appReady) {
      wakingRetry.textContent = 'Сервер ответил — подключаем socket…';
    }
  } catch (e) {}
}
let pokeInterval = setInterval(pokeServer, 3000);

function updateHud(state) {
  const p = state.players.find(x => x.id === me.id);
  if (!p) return;
  hpEl.style.width = (100 * p.hp / p.maxHp) + '%';
  goldEl.textContent = p.gold + '$';
  lvlEl.textContent = 'Lv ' + p.level;
  const inv = p.inventory || [];

  // магазин: купленные — .owned + динамическая цена +20% за каждый мерж
  [...shop.querySelectorAll('button[data-weapon]')].forEach(b => {
    const k = b.dataset.weapon;
    const owned = inv.includes(k);
    b.classList.toggle('owned', owned);
    const basePrice = weapons[k]?.price || 0;
    const mergeCount = owned ? (p.weaponMerge?.[k] || 1) : 0;
    const curPrice = Math.round(basePrice * (1 + mergeCount * 0.20));
    const priceEl = b.querySelector('.price');
    if (priceEl && basePrice > 0) {
      // показываем текущую цену; если не хватает золота — подсветить красным
      const cant = p.gold < curPrice;
      priceEl.textContent = curPrice + '$';
      priceEl.style.color = cant ? '#ff6644' : '#ffd54a';
      // подсветить кнопку как «слишком дорого»
      b.disabled = cant;
    }
  });

  // инвентарь: 6 слотов. Внутри иконка оружия + счётчик купленных копий (если > 1)
  const slots = [...inventoryDiv.querySelectorAll('.slot')];

  slots.forEach((s, i) => {
    if (i < inv.length) {
      s.classList.add('filled');
      const wpnKey = inv[i];
      // cnt = количество купленных копий (из weaponMerge, не из дублей inventory)
      const cnt = (p.weaponMerge && p.weaponMerge[wpnKey]) || 1;
      const wInfo = weapons[wpnKey];
      const ico = WEAPON_ICONS[wpnKey] || '⚔';
      // иконка оружия (крупно) + название (мелко) + счётчик в углу (если >1)
      const dmgAt = ((Math.pow(0.75, cnt - 1)) * 100).toFixed(cnt > 1 ? 0 : 0);
      const targetCount = cnt;            // копии == цели
      const color = cnt >= 4 ? '#ff6644' : cnt >= 2 ? '#ffd54a' : '#7ad7ff';
      s.innerHTML = `
        <div class="weap-ico">${ico}</div>
        <div class="weap-name">${wInfo ? wInfo.name : wpnKey}</div>
        ${cnt > 1 ? `<div class="cnt" style="color:${color}">×${cnt}</div>` : ''}
      `;
    } else {
      s.classList.remove('filled');
      s.innerHTML = '<div class="empty">+</div>';
    }
  });

  // скиллы
  [...skillsDiv.children].forEach(b => {
    b.querySelector('.lvl').textContent = p.skillLevels[+b.dataset.slot];
  });

  // магазин: показываем индикатор если близко к своей базе (не к координатам мирового shop)
  let myBase = null;
  if (state.bases && p) {
    myBase = state.bases.find(b => b.owner === (p.team || 'blue'));
  }
  if (myBase && p) {
    const dist = Math.hypot(p.x - myBase.x, p.y - myBase.y);

      shop.style.display = 'flex';
      shopOpen = true;
    } else if (!near && shopOpen) {
      shop.style.display = 'none';
      shopOpen = false;
    }
  }

// ---------- оптимизация: пре-рендерим осьминогов в offscreen canvas ----------
// Каждый вариант рисуется ОДИН раз, потом просто drawImage — в 10x быстрее
const OCTO_CACHE = {};
function getOctopusSprite(key, color, size, legsCount, legsLen, ringColor) {
  const k = `${key}_${color}_${size}_${legsCount}_${legsLen}_${ringColor||'none'}_${size}`;
  if (OCTO_CACHE[k]) return OCTO_CACHE[k];
  const off = document.createElement('canvas');
  const R = Math.ceil(size + legsLen + 6);
  off.width = off.height = R * 2;
  const c = off.getContext('2d');
  c.translate(R, R);
  // 8 щупалец — STATIC без анимации (оптимизация CPU)
  c.strokeStyle = color;
  c.lineWidth = 2;
  for (let i = 0; i < legsCount; i++) {
    const a = (i / legsCount) * Math.PI * 2;
    const ex = Math.cos(a + Math.PI/4) * (size + legsLen * 0.7);
    const ey = Math.sin(a + Math.PI/4) * (size + legsLen * 0.7);
    const tx = Math.cos(a) * (size + legsLen);
    const ty = Math.sin(a) * (size + legsLen);
    c.beginPath();
    c.moveTo(Math.cos(a) * size, Math.sin(a) * size);
    c.quadraticCurveTo(ex, ey, tx, ty);
    c.stroke();
  }
  // тело
  c.fillStyle = color;
  c.beginPath(); c.arc(0, 0, size, 0, Math.PI*2); c.fill();
  // глаза
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(-size*0.35, -size*0.2, size*0.22, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc( size*0.35, -size*0.2, size*0.22, 0, Math.PI*2); c.fill();
  c.fillStyle = '#000';
  c.beginPath(); c.arc(-size*0.35, -size*0.2, size*0.1, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc( size*0.35, -size*0.2, size*0.1, 0, Math.PI*2); c.fill();
  // ring (для range creeps) — рисуем ДО тела, но здесь после — поверх
  if (ringColor) {
    c.strokeStyle = ringColor;
    c.lineWidth = 2;
    c.beginPath(); c.arc(0, 0, size + 3, 0, Math.PI*2); c.stroke();
  }
  OCTO_CACHE[k] = off;
  return off;
}

// ---------- отрисовка ----------
let drawScheduled = false;

// --- крипы: медуза (tank) и морской конёк (range) ---
// эти КАРДИНАЛЬНО отличаются от героев-осьминогов: сразу видно кто крип
function drawCreep(m) {
  const isRange = m.variant === 1 || m.variant === 'range';
  const baseColor = m.color || (m.team === 'red' ? '#cc5566' : '#5566cc');
  const x = m.x, y = m.y;
  ctx.save();
  ctx.translate(x, y);
  if (isRange) drawSeahorse(baseColor, m);
  else         drawMeduza(baseColor, m);
  ctx.restore();
}

// МЕДУЗА — купол сверху, щупальца снизу. Танк — близкая атака, медленный
function drawMeduza(color, m) {
  const t = performance.now() * 0.001;
  const r = m.size || 11;     // радиус купола
  const r0 = r * 0.75;
  // полупрозрачная оболочка купола
  ctx.fillStyle = hexA(color, 0.65);
  ctx.beginPath();
  ctx.arc(0, 0, r, Math.PI, 0, false);   // верхняя половина
  // слегка волнистое дно — мелкие дуги (effervescent)
  const waveAmp = 2;
  const waveN = 7;
  for (let i = 0; i <= waveN; i++) {
    const ang = Math.PI - (i / waveN) * Math.PI;
    const rr = r + Math.sin(t*2 + i*0.6) * waveAmp;
    ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr + 1);   // +1 чтобы дно под куполом
  }
  ctx.closePath();
  ctx.fill();
  // щупальца: 6 штук, качаются с разной фазой
  const tentN = 6;
  const tentLen = r * 1.4;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  for (let i = 0; i < tentN; i++) {
    const baseAng = Math.PI + (i + 0.5) * Math.PI / tentN;  // нижняя половина
    const swing = Math.sin(t*1.5 + i*1.1) * 0.3;             // покачивание
    const a = baseAng + swing;
    ctx.beginPath();
    ctx.moveTo(Math.cos(Math.PI) * r * 0.85, Math.sin(Math.PI) * r * 0.85);
    // изгиб — контрольная точка смещена вбок
    const mxa = Math.cos(a) * r * 0.6;
    const mya = Math.sin(a) * r * 0.6 + 2;
    const exa = Math.cos(a) * (r + tentLen * 0.7);
    const eya = Math.sin(a) * (r + tentLen * 0.7);
    ctx.quadraticCurveTo(mxa, mya, exa, eya);
    ctx.stroke();
    // шарик на конце щупальца
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(exa, eya, 1.5, 0, Math.PI*2);
    ctx.fill();
  }
  // купол — обводка
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r0, Math.PI, 0, false);
  ctx.stroke();
  // глазки (мини как у осьминога)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r*0.32, -r*0.15, r*0.16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( r*0.32, -r*0.15, r*0.16, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-r*0.32, -r*0.15, r*0.07, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( r*0.32, -r*0.15, r*0.07, 0, Math.PI*2); ctx.fill();
}

// МОРСКОЙ КОНЁК — голова+хвост+плавник. Range — дальняя атака, быстрый
function drawSeahorse(color, m) {
  const t = performance.now() * 0.001;
  const r = m.size || 9;
  const dirX = Math.cos(m.facing || 0);
  const dirY = Math.sin(m.facing || 0);
  ctx.save();
  ctx.rotate(m.facing || 0);   // конёк смотрит туда же, куда целится
  // животик/тело — S-образная дуга, спина выпуклая вверх
  // хвост уходит от головы противоположно facing
  ctx.strokeStyle = color;
  ctx.lineWidth = r * 0.8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(r*1.1, 0);             // голова — справа
  // контрольная точка — выгиб спины
  const cpx = 0;
  const cpy = -r*1.0;
  // конец хвоста — слева, с завитком
  const tailX = -r*1.3;
  const tailY =  0;
  ctx.quadraticCurveTo(cpx, cpy, tailX, tailY);
  ctx.stroke();
  // завиток на конце хвоста
  ctx.lineWidth = r * 0.5;
  ctx.beginPath();
  ctx.arc(tailX, tailY, r * 0.45, 0, Math.PI * 1.5, false);
  ctx.stroke();
  // головка — шарик на конце шеи
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(r*1.1, 0, r*0.8, 0, Math.PI*2);
  ctx.fill();
  // гребень (корона) сверху на голове — чтобы читалось "конёк"
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(r*1.05, -r*0.7);
  ctx.lineTo(r*1.30, -r*0.5);
  ctx.lineTo(r*0.85, -r*0.4);
  ctx.closePath();
  ctx.fill();
  // глазик
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(r*1.30, -r*0.10, r*0.22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(r*1.34, -r*0.10, r*0.10, 0, Math.PI*2); ctx.fill();
  // плавник сбоку — покачивается
  const finSway = Math.sin(t*3 + (m.id||0)) * r * 0.2;
  ctx.fillStyle = hexA('#ffffff', 0.5);
  ctx.beginPath();
  ctx.moveTo(r*0.4, 0);
  ctx.quadraticCurveTo(r*0.4 + finSway, r*0.7, r*0.0, r*0.5);
  ctx.quadraticCurveTo(-r*0.4 + finSway, r*0.3, -r*0.2, 0);
  ctx.closePath();
  ctx.fill();
  // жёлтая обводка — чтобы range всё ещё отличался
  ctx.strokeStyle = '#ffdd44';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(r*1.1, 0, r*1.0, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

// превращает #rrggbb + alpha в rgba(...)
function hexA(hex, alpha) {
  if (!hex || hex[0] !== '#' || hex.length < 7) return `rgba(255,255,255,${alpha})`;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function draw(state) {
  try {
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);

  // ---------- ФОН: морское дно (песок + лёгкая рябь, статичный) ----------
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0,    '#0d3a5c');   // тёмно-синяя вода сверху
  grd.addColorStop(0.35, '#155580');
  grd.addColorStop(0.85, '#1e6e88');
  grd.addColorStop(1,    '#3a5a3e');   // зеленовато-коричневый песок снизу
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
  // песчаные точки (статичный random seed)
  ctx.fillStyle = 'rgba(220,200,160,0.35)';
  for (let i = 0; i < 80; i++) {
    const sx = ((i * 7919) % W);
    const sy = H - ((i * 677) % Math.floor(H * 0.35));
    const sz = 1 + (i % 3);
    ctx.fillRect(sx, sy, sz, sz);
  }
  // камешки
  ctx.fillStyle = 'rgba(120,90,60,0.5)';
  for (let i = 0; i < 25; i++) {
    const sx = (i * 437) % W;
    const sy = H - 10 - (i * 191) % Math.floor(H * 0.2);
    ctx.beginPath(); ctx.arc(sx, sy, 1 + (i % 4), 0, Math.PI*2); ctx.fill();
  }

  // ---------- КОРИДОРЫ (2 полосы: left 33%, right 67%) ----------
  ctx.fillStyle = 'rgba(150,200,255,0.06)';
  for (const x of [W * 0.33, W * 0.67]) {
    ctx.fillRect(x - 32, 0, 64, H);
  }

  // ---------- НЕПРОХОДИМАЯ СТЕНА по центру (риф/коралловая гряда) ----------
  // ТОЛЬКО В ЦЕНТРЕ КАРТЫ — открытые проходы сверху и снизу (согласовано с сервером)
  const wallX = W / 2;
  const wallW = 22;
  const wallYTop = H / 2 - 130;
  const wallYBot = H / 2 + 130;
  // основа стены — каменная полоса
  const wallGrd = ctx.createLinearGradient(wallX - wallW, 0, wallX + wallW, 0);
  wallGrd.addColorStop(0,    '#2a3a40');
  wallGrd.addColorStop(0.5,  '#4a5a48');
  wallGrd.addColorStop(1,    '#2a3a40');
  ctx.fillStyle = wallGrd;
  ctx.fillRect(wallX - wallW, wallYTop, wallW * 2, wallYBot - wallYTop);
  // бугры на стене (статичные) — внутри диапазона
  ctx.fillStyle = '#3a4a44';
  for (let i = 0; i < 10; i++) {
    const by = wallYTop + (i / 10) * (wallYBot - wallYTop);
    ctx.beginPath();
    ctx.arc(wallX + (i % 2 === 0 ? -wallW - 2 : wallW + 2), by, 6 + (i % 3) * 2, 0, Math.PI*2);
    ctx.fill();
  }
  // маленькие водоросли внизу стены (у входа в нижний коридор)
  ctx.fillStyle = '#7a3a3a';
  for (let i = 0; i < 5; i++) {
    const cx = wallX + (i - 2) * 6;
    ctx.beginPath();
    ctx.arc(cx, wallYBot + 4 + (i % 2) * 3, 3 + (i % 2) * 2, 0, Math.PI*2);
    ctx.fill();
  }
  // маленькие водоросли вверху стены (у входа в верхний коридор)
  for (let i = 0; i < 5; i++) {
    const cx = wallX + (i - 2) * 6;
    ctx.beginPath();
    ctx.arc(cx, wallYTop - 4 - (i % 2) * 3, 3 + (i % 2) * 2, 0, Math.PI*2);
    ctx.fill();
  }
  // подсказка проходов сверху/снизу
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
  ctx.fillText('▼ проход ▼', wallX, wallYTop - 14);
  ctx.fillText('▲ проход ▲', wallX, wallYBot + 18);
  // подсказка "СТЕНА"
  ctx.fillStyle = '#aab';
  ctx.fillText('◄ СТЕНА ►', wallX, H / 2 - 130 + 16);

  // базы
  for (const b of state.bases) {
    // зона лечения/атаки (range = 80)
    const grd = ctx.createRadialGradient(b.x, b.y, 30, b.x, b.y, 80);
    if (b.owner === 'blue') { grd.addColorStop(0, 'rgba(34,140,255,.25)'); grd.addColorStop(1, 'rgba(34,140,255,0)'); }
    else                     { grd.addColorStop(0, 'rgba(255,80,80,.25)'); grd.addColorStop(1, 'rgba(255,80,80,0)'); }
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(b.x, b.y, 80, 0, Math.PI*2); ctx.fill();
    // тонкая обводка range
    ctx.strokeStyle = b.owner === 'blue' ? 'rgba(80,160,255,.4)' : 'rgba(255,120,120,.4)';
    ctx.lineWidth = 1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(b.x, b.y, 80, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = b.owner === 'blue' ? '#224488' : '#882222';
    ctx.beginPath(); ctx.arc(b.x, b.y, 30, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#400';
    ctx.fillRect(b.x-25, b.y-40, 50, 6);
    ctx.fillStyle = '#0d4';
    ctx.fillRect(b.x-25, b.y-40, 50 * (b.hp/b.maxHp), 6);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BASE', b.x, b.y+4);
  }

  // магазин (маркер у синей базы)
  if (state.shop) {
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.arc(state.shop.x, state.shop.y, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SHOP', state.shop.x, state.shop.y+3);
  }

  // осьминог — это ОБЪЕКТ offscreen canvas, рисуется drawImage (быстро)
  function drawOctopus(x, y, color, size, legsCount, legsLen, angleOffset = 0, tier = 0, ringColor = null) {
    const sprite = getOctopusSprite('octo', color, size, 8, 4, ringColor);
    const R = sprite.width / 2;
    ctx.drawImage(sprite, Math.round(x - R), Math.round(y - R));
  }
  // крипы: variant 0=meduza (tank), 1=seahorse (range) — ВНЕШНЕ ОТЛИЧАЮТСЯ
  // от героев-осьминогов, чтобы с первого взгляда было понятно кто где
  for (const m of state.mobs) {
    const isRange = m.variant === 1 || m.variant === 'range';
    drawCreep(m);
    // хп-бар
    const barW = isRange ? 16 : 22;
    ctx.fillStyle = '#000';
    ctx.fillRect(m.x-barW/2, m.y-(isRange?13:15)-8, barW, 2);
    ctx.fillStyle = isRange ? '#ffdd44' : '#fff';
    ctx.fillRect(m.x-barW/2, m.y-(isRange?13:15)-8, barW * (m.hp/m.maxHp), 2);
  }

  // снаряды
  for (const p of state.projectiles) {
    ctx.fillStyle = p.isCannon ? '#ff8800' : '#ffff66';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.isCannon ? 5 : 3, 0, Math.PI*2);
    ctx.fill();
  }

  // осьминоги-игроки
  for (const p of state.players) {
    // drawOctopus неповорачивается вместе с targetAngle, поэтому дуло рисуем отдельно
    drawOctopus(p.x, p.y, p.color, 12, 8, 4, Math.random() * 0.3, 0);
    // "дуло" — идёт в направлении targetAngle
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.targetAngle || 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(10, -3, 10, 6);
    ctx.restore();
    // хп
    ctx.fillStyle = '#000';
    ctx.fillRect(p.x-18, p.y-26, 36, 4);
    ctx.fillStyle = '#dd3344';
    ctx.fillRect(p.x-18, p.y-26, 36 * (p.hp/p.maxHp), 4);
    ctx.fillStyle = '#fff'; ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.name + ' Lv' + p.level, p.x, p.y-30);
  }

  // осьминоги-боты (рисуем поверху игроков чтобы было видно)
  if (state.bots) {
    for (const b of state.bots) {
      // bot color чуть тусклее обычного (alpha)
      ctx.globalAlpha = 0.85;
      drawOctopus(b.x, b.y, b.color, 11, 8, 4, Math.random() * 0.4, 0);
      ctx.globalAlpha = 1;
      // дуло
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.targetAngle || 0);
      ctx.fillStyle = '#ddd';
      ctx.fillRect(9, -2, 8, 4);
      ctx.restore();
      // хп
      ctx.fillStyle = '#000';
      ctx.fillRect(b.x-16, b.y-24, 32, 3);
      ctx.fillStyle = '#dd3344';
      ctx.fillRect(b.x-16, b.y-24, 32 * (b.hp/b.maxHp), 3);
      // имя с иконкой команды
      ctx.fillStyle = '#ccc'; ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      const teamIcon = b.team === 'red' ? '🔴' : '🔵';
      const stateIcon = b.state === 'FIGHT' ? '⚔️' : b.state === 'RETREAT' ? '🏃' : b.state === 'SHOP' ? '💰' : '🧑‍🌾';
      ctx.fillText(`${teamIcon} ${b.name} ${stateIcon}`, b.x, b.y-28);
    }
  }

  } catch (e) {
    setStatus('💥 draw err: ' + (e.message||e), false);
    return;
  }
  // перерисовка ТОЛЬКО когда придёт новый state (10 fps server tick)
  // никакого requestAnimationFrame — дёшево для CPU телефона
}

// первый ресайз
resize();

// ---------- PWA ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</div>
</body>
</html>
